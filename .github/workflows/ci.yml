name: CI

on:
  repository_dispatch:
  workflow_dispatch:

  # TODO: delete before merge!!!
  push:
    branches:
      - "ci"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare summary
      run: |
        SUMMARY="$HOME/summary.md"
        touch "$SUMMARY"

    - name: Install depdendencies
      run: python3 -m pip install aiohttp requests

    - name: Generate Dataset
      run: python3 scripts/gen_dataset.py

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j

    - name: Run tests
      run: |
        echo "# Tests" >> "$SUMMARY"
        echo "```" >> "$SUMMARY"
        ./build/notification_tests >> "$SUMMARY"
        echo "```" >> "$SUMMARY"

    - name: Run benchmarks
      run: |
        echo "# Benchmarks" >> "$SUMMARY"
        echo "```" >> "$SUMMARY"
        ./build/notification_bench >> "$SUMMARY"
        echo "```" >> "$SUMMARY"

    - name: Run service in background
      run: ./build/notification_service &

    - name: Preload dataset
      run: python3 scripts/preload.py --url http://localhost:8080

    - name: Run load test
      run: |
        echo "# Tests" >> "$SUMMARY"
        echo "```" >> "$SUMMARY"
        python3 scripts/load_test.py --url http://localhost:8080 --duration 60s --concurrency 50 >> "$SUMMARY"
        echo "```" >> "$SUMMARY"

    - name: Publish summary
      run: cp $SUMMARY "$GITHUB_STEP_SUMMARY"
